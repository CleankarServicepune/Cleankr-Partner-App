name: Build Cleankr Partner App (APK & AAB)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Restore Keystore from base64
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            cp debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
            cp debug.keystore ~/.android/debug.keystore
          fi

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew || true

      - name: Build Debug & Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release Bundle (AAB)
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace || ./gradlew bundleDebug --no-daemon --stacktrace

      - name: Upload APKs Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cleankr-Partner-APKs
          path: app/build/outputs/apk/**/*.apk

      - name: Upload AAB Bundle Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cleankr-Partner-AABs
          path: app/build/outputs/bundle/**/*.aab
