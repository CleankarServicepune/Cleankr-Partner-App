name: Build Cleankr Partner App (APK & AAB)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare Release Signing Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Restoring official upload keystore from GitHub Secret KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          elif [ -f "my-upload-key.jks" ]; then
            echo "Using existing repository my-upload-key.jks"
          elif [ -f "upload-keystore.jks" ]; then
            cp upload-keystore.jks my-upload-key.jks
          else
            echo "::error::CRITICAL: No upload keystore found! Please configure KEYSTORE_BASE64 in GitHub Repository Secrets."
            exit 1
          fi

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Release Bundle (AAB)
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Mandatory Signing Certificate Verification
        run: |
          echo "========================================================"
          echo "Verifying Release AAB Signing Certificate Fingerprints..."
          echo "========================================================"
          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "::error::Release AAB file was not generated!"
            exit 1
          fi
          CERT_OUTPUT=$(keytool -printcert -jarfile "$AAB_FILE")
          echo "$CERT_OUTPUT"
          
          EXPECTED_SHA1="2A:C2:B0:99:91:83:41:2B:73:B2:1C:4B:69:20:16:68:75:DD:E3:AB"
          if echo "$CERT_OUTPUT" | grep -q "$EXPECTED_SHA1"; then
            echo "SUCCESS: AAB signature perfectly matches Google Play registered SHA-1!"
          else
            echo "::warning::AAB signature does NOT match expected Google Play upload key: $EXPECTED_SHA1"
            echo "If Play Console rejects this build, update KEYSTORE_BASE64 in GitHub Secrets with the keystore containing $EXPECTED_SHA1"
          fi

      - name: Upload APKs Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cleankr-Partner-APKs
          path: app/build/outputs/apk/**/*.apk

      - name: Upload AAB Bundle Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cleankr-Partner-AABs
          path: app/build/outputs/bundle/**/*.aab
